<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#14202b;--mut:#5d6b78;--line:#d5dce3;--acc:#1f5eff;--ok:#1e7a4f;--warn:#b86e00;--bad:#c0362c;--chip:#e4e9ef}
@media(prefers-color-scheme:dark){:root{--bg:#0f161d;--card:#18222c;--ink:#e8edf2;--mut:#93a1ae;--line:#2c3947;--acc:#6b95ff;--ok:#4cc38a;--warn:#e8a23a;--bad:#ff7a6e;--chip:#233140}}
*{box-sizing:border-box}html,body{margin:0}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em}
nav{display:flex;gap:4px}
nav button{border:0;background:none;color:var(--mut);padding:8px 14px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
nav button.on{background:var(--chip);color:var(--ink)}
main{max-width:1100px;margin:0 auto;padding:20px}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.g{background:var(--chip);color:var(--ink)}.btn.d{background:none;color:var(--bad);padding:6px 8px}
.btn.s{padding:5px 10px;font-size:13px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stat b{display:block;font-size:26px;letter-spacing:-.02em}.stat span{color:var(--mut);font-size:13px}
.stat.alert b{color:var(--bad)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.bar input,.bar select{width:auto;flex:1 1 180px}
.tw{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--mut);font-weight:600}tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--chip)}
.tag.low{color:var(--warn)}.tag.out{color:var(--bad)}.tag.ok{color:var(--ok)}
.in{color:var(--ok);font-weight:600}.outc{color:var(--bad);font-weight:600}
.empty{padding:40px 20px;text-align:center;color:var(--mut)}
h2{font-size:16px;margin:24px 0 10px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:20px;width:min(460px,94vw)}
dialog::backdrop{background:rgba(10,15,20,.55)}
dialog h3{margin:0 0 14px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f label{display:block;font-size:13px;color:var(--mut)}.f .w{grid-column:1/-1}
.act{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
#pa{display:none}
@media print{body>*:not(#pa){display:none!important}body{background:#fff!important}
#pa{display:block;color:#000;background:#fff;font:13px/1.4 system-ui,sans-serif}
#pa .tw{background:#fff;border:0;overflow:visible}#pa table{min-width:0;width:100%}
#pa th,#pa td{color:#000;white-space:normal;border-bottom:1px solid #999;padding:5px 6px}
#pa.rc{border:4px double #000;padding:22px 26px;max-width:440px;margin:0 auto}#pa.rc h1,#pa.rc h2,#pa.rc .ty{text-align:center}#pa.rc h2{border-bottom:2px dashed #000;padding-bottom:10px}#pa.rc th{border-bottom:2px solid #000}#pa.rc .tot{border-top:2px dashed #000;padding-top:10px;text-align:right}#pa.rc .ty{border-top:2px dashed #000;padding-top:10px}}
</style>

<header>
 <h1>Stock Manager</h1>
 <nav id="nav"></nav>
 <div class="bar" style="margin:0" id="acts"></div>
</header>

<div id="kb"></div>

 <div class="act"><button class="btn g" onclick="idlg.close()">Cancel</button><button class="btn" onclick="saveItem()">Save item</button></div></form></dialog>
<dialog id="mdlg"><form method="dialog" onsubmit="return false"><h3>Stock in / out</h3><div class="f" id="mform"></div>
 <div class="act"><button class="btn g" onclick="mdlg.close()">Cancel</button><button class="btn" onclick="saveMove()">Record movement</button></div></form></dialog>
<dialog id="menu"><h3>Your data</h3>
 <p style="color:var(--mut);margin-top:0">Everything is saved in this browser on this computer. Back up regularly.</p>
 <div class="f">
  <button class="btn w" onclick="backup()" style="grid-column:1/-1">Download full backup (.json)</button>
  <label class="w">Restore backup<input type="file" accept=".json" onchange="restore(this)"></label>
  <button class="btn g w" onclick="csvOut()" style="grid-column:1/-1">Export inventory (.csv)</button>
  <label class="w">Import items from CSV<input type="file" accept=".csv" onchange="csvIn(this)"></label>
  <label class="w">Owner password (4 or more characters)<input id="np" type="password" placeholder="New owner password" autocomplete="off"></label>
  <button class="btn w" style="grid-column:1/-1" onclick="setPin()">Set or change owner password</button>
  <button class="btn g w" style="grid-column:1/-1" onclick="setPin(true)">Remove owner password (turns the login screen off)</button>
  <button class="btn d w" style="grid-column:1/-1;border:1px solid var(--bad)" onclick="wipe()">Erase all data and start fresh</button>
  <label class="w">Accountant password (4 or more characters)<input id="mp" type="password" placeholder="New accountant password" autocomplete="off"></label>
  <button class="btn w" style="grid-column:1/-1" onclick="setMpin()">Set or change accountant password</button>
  <button class="btn g w" style="grid-column:1/-1" onclick="setMpin(true)">Remove accountant password</button>

    <label class="w">Business name (shown on printouts)<input id="biz" oninput="S.biz=this.value;save();document.querySelector('header h1').textContent=this.value||'Stock Manager'"></label>

 </div>

<script>
const $=id=>document.getElementById(id), KEY="phone-stock-v1";
const CATS=["Smartphones","Feature phones","Tablets","Accessories","SIM cards","Routers & MiFi","Other"];

const hs=t=>{let a=3735928559,b=1103547991;t="ps:"+t;for(let i=0;i<t.length;i++){const c=t.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}return(a>>>0).toString(36)+(b>>>0).toString(36)};

function loginView(){const need=lrole!=="staff"||!!S.spin,D={owner:["Owner","Full access to everything"],accountant:["Accountant","Sales, credit, movements and stock in"],warehouse:["Warehouse manager","Give stock out to customers"],staff:["Sales personnel","Record sales and credit sales"]};

const PAL=["#0b5c7a","#e0a100","#2e8b57","#b00020","#6b4fa0","#e07a1f","#5a7684"];
function dash(){
 const dk=t=>new Date(t).toLocaleDateString("en-CA"),today=dk(Date.now()),I=S.items,
  units=I.reduce((a,i)=>a+i.qty,0),val=I.reduce((a,i)=>a+i.qty*i.cost,0),retail=I.reduce((a,i)=>a+i.qty*i.price,0),
  low=I.filter(i=>i.qty>0&&i.qty<=i.reorder).sort((a,b)=>a.qty/(a.reorder||1)-b.qty/(b.reorder||1)),out=I.filter(i=>i.qty<=0),ok=I.length-low.length-out.length,
  sales=S.moves.filter(m=>m.type==="Sale"),ts=sales.filter(m=>dk(m.t)===today),
  tU=-ts.reduce((a,m)=>a+m.d,0),tR=ts.reduce((a,m)=>a-m.d*(m.pr||0),0),tP=ts.reduce((a,m)=>a-m.d*((m.pr||0)-(m.cost||0)),0),
  tC=S.led.filter(l=>l.amt>0&&dk(l.t)===today).reduce((a,l)=>a+l.amt,0),
  owed=S.cust.map(c=>({n:c.name,b:bal(c.id)})).filter(x=>x.b>0).sort((a,b)=>b.b-a.b),owedT=owed.reduce((a,x)=>a+x.b,0);
 const cats={};I.forEach(i=>{cats[i.cat||"Other"]=(cats[i.cat||"Other"]||0)+(val>0?i.qty*i.cost:i.qty)});
 const ce=Object.entries(cats).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]),ct=ce.reduce((a,e)=>a+e[1],0);let acc=0;
 const grad=ce.map((e,i)=>{const f=acc/ct*100;acc+=e[1];return `${PAL[i%PAL.length]} ${f}% ${acc/ct*100}%`}).join(",");
 const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=d.toLocaleDateString("en-CA");days.push({l:d.toLocaleDateString([],{weekday:"short"}),v:sales.filter(m=>dk(m.t)===k).reduce((a,m)=>a-m.d*(m.pr||0),0)})}
 const mx=Math.max(1,...days.map(d=>d.v)),pc=n=>I.length?n/I.length*100:0,P=(t,b,c="")=>`<div class="dp ${c}"><h3>${t}</h3><div class="bd">${b}</div></div>`;
 const rows=(arr,f)=>arr.length?arr.map(f).join(""):"";
 $("v").innerHTML=(S.pin?"":`<div class="tw empty" style="margin-bottom:14px;padding:12px">Logins are off. Set an owner password under Data to turn on the login screen.</div>`)+
 `<div class="dh"><div class="hero"><div class="hl">Stock value at cost</div><div class="hv">${money(val)}</div>
   <div class="hs">${I.length} products &middot; ${units.toLocaleString()} units &middot; potential margin ${money(retail-val)}</div>
   <div class="seg" title="Stock health"><i style="width:${pc(ok)}%;background:#4fd08a"></i><i style="width:${pc(low.length)}%;background:#ffd24a"></i><i style="width:${pc(out.length)}%;background:#ff7a6e"></i></div>
   <div class="sl"><span><u style="background:#4fd08a"></u>${ok} in stock</span><span><u style="background:#ffd24a"></u>${low.length} low</span><span><u style="background:#ff7a6e"></u>${out.length} out</span></div></div>
  ${P("Today",`<div class="kv"><span>Sales</span><b>${money(tR)}</b></div><div class="kv"><span>Units sold</span><b>${tU}</b></div><div class="kv"><span>Profit</span><b>${money(tP)}</b></div><div class="kv"><span>Given on credit</span><b>${money(tC)}</b></div>`)}
  ${P("Owed by customers",`<div class="hv2 ${owedT>0?"bad":""}">${money(owedT)}</div><div class="hs2">${owed.length} customer${owed.length===1?"":"s"} with a balance</div>`+rows(owed.slice(0,3),x=>`<div class="kv"><span>${esc(x.n)}</span><b>${money(x.b)}</b></div>`))}</div>
 <div class="dg">
  ${P("Stock by category",ce.length?`<div class="dn"><div class="ring" style="background:conic-gradient(${grad})"><span>${ce.length}<small>categor${ce.length===1?"y":"ies"}</small></span></div><div class="lg2">${ce.slice(0,7).map((e,i)=>`<div><u style="background:${PAL[i]}"></u>${esc(e[0])}<b>${Math.round(e[1]/ct*100)}%</b></div>`).join("")}</div></div>`:`<div class="mt">No stock yet. Add items to see this chart.</div>`)}
  ${P("Sales, last 7 days",`<div class="cols">${days.map(d=>`<div><em>${d.v?money(d.v).replace(/\.00$/,""):""}</em><i style="height:${Math.max(d.v/mx*100,d.v?3:0)}%"></i><span>${d.l}</span></div>`).join("")}</div>`)}
  ${P(`Needs reordering (${low.length+out.length})`,low.length+out.length?rows(out.concat(low).slice(0,8),i=>`<div class="rr"><div class="rn">${esc(i.name)}<small>${i.qty<=0?"Out of stock":i.qty+" left, reorder at "+i.reorder}</small></div><div class="rb"><i style="width:${i.reorder?Math.min(100,i.qty/i.reorder*100):0}%;background:${i.qty<=0?"var(--bad)":"var(--warn)"}"></i></div></div>`)+(low.length+out.length>8?`<div class="mt">and ${low.length+out.length-8} more. See Inventory, filter Low or out.</div>`:""):`<div class="mt">${I.length?"Nothing to reorder. All stock is above its reorder level.":"No items yet. Choose Add item to start."}</div>`,"wl")}
  ${P("Latest movements",S.moves.length?rows(S.moves.slice(0,6),m=>`<div class="rr mv"><div class="rn">${esc(m.name)}<small>${when(m.t)} &middot; ${esc(m.type)}</small></div><b class="${m.d>0?"in":"outc"}">${m.d>0?"+":""}${m.d}</b></div>`):`<div class="mt">No stock movements yet.</div>`)}
 </div>`}

function table(head,rows,num=[]){return `<div class="tw"><table><thead><tr>${head.map((x,i)=>`<th class="${num.includes(i)?"n":""}">${x}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`}

function inv(){
 const rows=S.items.filter(i=>(!cat||i.cat===cat)&&(!flt||(flt==="low"?i.qty<=i.reorder:i.qty>0))&&
  (!q||[i.name,i.sku,i.brand,i.loc].join(" ").toLowerCase().includes(q.toLowerCase())));
 const cats=[...new Set([...CATS,...S.items.map(i=>i.cat)])];
 $("v").innerHTML=`<div class="bar"><input id="sq" placeholder="Search name, SKU, brand or location" value="${esc(q)}">
  <select id="sc"><option value="">All categories</option>${cats.map(c=>`<option ${c===cat?"selected":""}>${esc(c)}</option>`).join("")}</select>
  <select id="sf"><option value="">All stock levels</option><option value="low" ${flt==="low"?"selected":""}>Low or out</option><option value="in" ${flt==="in"?"selected":""}>Available</option></select></div>`+
  (rows.length?invTable(rows):`<div class="tw empty">${S.items.length?"No items match these filters.":"No items yet. Choose Add item to create your first product."}</div>`);
 $("sq").oninput=e=>{q=e.target.value;const p=e.target.selectionStart;inv();$("sq").focus();$("sq").setSelectionRange(p,p)};
 $("sc").onchange=e=>{cat=e.target.value;inv()};$("sf").onchange=e=>{flt=e.target.value;inv()}}

function invTable(rows){const o=mode==="owner",m=mode==="accountant";
 return table(["Item","SKU","Category","Location","Qty",...(o?["Cost"]:[]),"Price","Status",...(o||m?[""]:[])],rows.map(i=>{const[s,l]=status(i);
 return `<tr><td><b>${esc(i.name)}</b><br><small style="color:var(--mut)">${esc(i.brand)}</small></td><td>${esc(i.sku)}</td><td>${esc(i.cat)}</td><td>${esc(i.loc)}</td><td class="n">${i.qty}</td>${o?`<td class="n">${money(i.cost)}</td>`:""}<td class="n">${money(i.price)}</td><td><span class="tag ${s}">${l}</span></td>${o?`<td><button class="btn g s" onclick="moveDlg('${i.id}')">Stock</button> <button class="btn g s" onclick="editItem('${i.id}')">Edit</button> <button class="btn d s" onclick="delItem('${i.id}')">Delete</button></td>`:m?`<td><button class="btn g s" onclick="moveDlg('${i.id}')">Stock in / return</button></td>`:""}</tr>`}),o?[4,5,6]:[4,5])}
function sales(){const o=mode==="owner",mg=mode!=="staff",td=dayStr(),ts=S.moves.filter(m=>m.type==="Sale"&&new Date(m.t).toDateString()===td),av=S.items.filter(i=>i.qty>0);
 const cg=S.led.filter(l=>l.amt>0&&new Date(l.t).toDateString()===td).reduce((a,l)=>a+l.amt,0),u=-ts.reduce((a,m)=>a+m.d,0),rev=ts.reduce((a,m)=>a-m.d*(m.pr||0),0),pf=ts.reduce((a,m)=>a-m.d*((m.pr||0)-(m.cost||0)),0);
 $("v").innerHTML=`<div class="tw" style="padding:16px;margin-bottom:20px"><h2 style="margin-top:0">Record a sale</h2>`+(av.length?`<div class="f"><label class="w">Item<select id="s_it" onchange="salePrice()">${av.map(i=>`<option value="${i.id}">${esc(i.name)} (${i.qty} left)</option>`).join("")}</select></label>${fld("s_q","Quantity",1,"number")}${fld("s_p","Price each","","number")}<label>Payment<select id="s_pay"><option value="">Paid now</option><option value="c">On credit</option></select></label><label>Customer<select id="s_cu"><option value="">Walk-in (no record)</option>${[...S.cust].sort((a,b)=>a.name.localeCompare(b.name)).map(c=>`<option value="${c.id}" ${c.id===lastCust?"selected":""}>${esc(c.name)}</option>`).join("")}</select></label><div class="w"><button class="btn g s" onclick="custDlg()">+ New customer</button></div>${fld("s_ref","IMEI / receipt no.","","text","w")}</div><div class="act"><button class="btn" onclick="saveSale()">Record sale</button></div>`:`<div class="empty">No items in stock to sell.</div>`)+`</div>`
 +(mg?`<div class="stats"><div class="stat"><b>${u}</b><span>Units sold</span></div><div class="stat"><b>${money(rev)}</b><span>Sales</span></div>${o?`<div class="stat"><b>${money(pf)}</b><span>Profit</span></div>`:""}<div class="stat"><b>${money(cg)}</b><span>Given on credit</span></div></div>`:"")
 +`<div class="bar" style="align-items:center"><h2 style="margin:0;flex:1 1 auto">${!(mg&&salesDay)||salesDay===iso()?"Today's sales":"Sales on "+td}</h2>`+(mg?`<input type="date" value="${salesDay||iso()}" max="${iso()}" style="flex:0 0 auto;width:auto" onchange="salesDay=this.value;render()">`:"")+`<button class="btn g s" onclick="printSales()">Print sales report</button></div>`+(ts.length?table(["Time","Item","Qty","Price","Total","IMEI / ref","Note",""],ts.map(m=>`<tr><td>${new Date(m.t).toLocaleTimeString([],{timeStyle:"short"})}</td><td>${esc(m.name)}</td><td class="n">${-m.d}</td><td class="n">${money(m.pr)}</td><td class="n">${money(-m.d*m.pr)}</td><td>${esc(m.ref)}</td><td>${esc(m.note)}</td><td><button class="btn g s" onclick="receipt(${m.t})">Receipt</button></td></tr>`),[2,3,4]):`<div class="tw empty">No sales recorded on this day.</div>`);
 salePrice()}
function salePrice(){const i=S.items.find(x=>x.id===$("s_it")?.value);if(i)$("s_p").value=i.price}
function saveSale(){const it=S.items.find(x=>x.id===$("s_it")?.value),q=Math.floor(parseFloat($("s_q").value)),p=parseFloat($("s_p").value);
 if(!it)return toast("Choose an item");if(!(q>0))return toast("Enter a quantity above zero");if(!(p>=0))return toast("Enter the selling price");
 if(q>it.qty)return toast(`Only ${it.qty} in stock`);
 const cr=$("s_pay").value==="c",c=S.cust.find(x=>x.id===$("s_cu").value),ref=$("s_ref").value.trim();
 if(cr&&!c)return toast("Choose or add the customer for a credit sale");
 addMove(it,"Sale",-q,ref,(cr?"On credit: ":c?"Paid: ":"")+(c?c.name:""),p);
 if(cr)S.led.unshift({t:Date.now(),cid:c.id,amt:q*p,desc:`${it.name} x${q}`+(ref?` (${ref})`:"")});
 save();render();toast(cr?"Credit sale recorded":"Sale recorded")}
const bal=id=>Math.round(S.led.filter(l=>l.cid===id).reduce((a,l)=>a+l.amt,0)*100)/100;
function credit(){const o=mode==="owner",mg=mode!=="staff",rows=S.cust.map(c=>({...c,b:bal(c.id)})).sort((a,b)=>b.b-a.b),owed=rows.reduce((a,c)=>a+c.b,0);
 $("v").innerHTML=(mg?`<div class="stats"><div class="stat ${owed>0?"alert":""}"><b>${money(owed)}</b><span>Total owed by customers</span></div><div class="stat"><b>${rows.filter(r=>r.b>0).length}</b><span>Customers with a balance</span></div></div>`:"")+`
 <div class="bar"><button class="btn" onclick="custDlg()">Add customer</button>${mg?`<button class="btn g" onclick="printCredit()">Print credit list</button>`:""}</div>`+(rows.length?table(["Customer","Phone","Balance owed","Last activity",""],rows.map(c=>{const l=S.led.find(x=>x.cid===c.id);
 return `<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.phone)}</td><td class="n"><span class="tag ${c.b>0?"low":"ok"}">${money(c.b)}</span></td><td>${l?when(l.t):""}</td><td><button class="btn s" onclick="payDlg('${c.id}')">Receive payment</button> <button class="btn g s" onclick="stmt('${c.id}')">Statement</button> ${o?`<button class="btn d s" onclick="delCust('${c.id}')">Delete</button>`:""}</td></tr>`}),[2]):`<div class="tw empty">No customers yet. Add a customer, then choose "On credit" when you record a sale.</div>`)}
function custDlg(){$("cform").innerHTML=fld("c_name","Customer name","","text","w")+fld("c_ph","Phone number","","tel","w");cdlg.showModal();$("c_name").focus()}
function saveCust(){const n=$("c_name").value.trim();if(!n)return toast("Enter the customer's name");const c={id:uid(),name:n,phone:$("c_ph").value.trim()};S.cust.push(c);lastCust=c.id;save();cdlg.close();render();toast("Customer added")}

function stmtTable(id){let r=0;const rows=S.led.filter(l=>l.cid===id).reverse().map(l=>{r+=l.amt;return `<tr><td>${when(l.t)}</td><td>${esc(l.desc)}</td><td class="n ${l.amt>0?"outc":"in"}">${l.amt>0?"Credit ":"Paid "}${money(Math.abs(l.amt))}</td><td class="n">${money(r)}</td></tr>`}).reverse();

function fkList(){const o=mode==="owner",a=mode==="accountant",x=[];

  return}

let wl=[],wcust="",wname="",wmode="d",wnote="";

 $("v").innerHTML=`<div class="tw" style="padding:16px;margin-bottom:20px"><h2 style="margin-top:0">Give stock out to a customer</h2><div class="f">

 <div style="margin-top:12px">${t}</div>

const credOf=id=>{const L=S.led.filter(l=>l.cid===id),g=L.filter(l=>l.amt>0).reduce((a,l)=>a+l.amt,0),pd=-L.filter(l=>l.amt<0).reduce((a,l)=>a+l.amt,0);return{g,pd,o:Math.round((g-pd)*100)/100}};
function credBox(){const c=S.cust.find(x=>x.id===wcust);if(!c)return"";const t=credOf(c.id);

 if(!it)return toast("Choose an item");if(!(q>0))return toast("Enter a quantity above zero");

function doIssue(){const c=S.cust.find(x=>x.id===wcust),cn=c?c.name:wname.trim();

function saveItem(){const g=k=>$("f_"+k)?.value.trim(),n=k=>Math.max(0,parseFloat(g(k))||0),id=$("idlg").dataset.id;

function parseCSV(t){const r=[];let row=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];
 if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
 else if(ch=='"')q=true;else if(ch==","){row.push(c);c=""}else if(ch=="\n"||ch=="\r"){if(ch=="\r"&&t[i+1]=="\n")i++;row.push(c);r.push(row);row=[];c=""}else c+=ch}
 if(c||row.length){row.push(c);r.push(row)}return r.filter(x=>x.some(y=>y.trim()))}
function csvIn(el){const f=el.files[0];if(!f)return;f.text().then(t=>{const [h,...rows]=parseCSV(t),ix=k=>h.findIndex(x=>x.trim().toLowerCase()===k);
 if(ix("name")<0)return toast("CSV needs a header row with at least a name column");let add=0,upd=0;
 rows.forEach(r=>{const v=k=>ix(k)<0?"":(r[ix(k)]||"").trim(),n=k=>Math.max(0,parseFloat(v(k))||0),name=v("name");if(!name)return;

  if(ex){Object.assign(ex,d);upd++}else{const it={id:uid(),qty:0,...d};S.items.push(it);const q=Math.floor(n("qty"));if(q>0)addMove(it,"Opening stock",q,"","Imported");add++}});
 save();menu.close();render();toast(`Imported: ${add} new, ${upd} updated`)});el.value=""}
